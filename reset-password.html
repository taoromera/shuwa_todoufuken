<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a365d" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="手話単語帳" />
    <title>新しいパスワード ・ 手話単語帳</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/auth/auth.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1>手話単語帳</h1>
      </header>

      <main class="auth-card">
        <h2>新しいパスワードの設定</h2>
        <form class="auth-form" id="reset-form" novalidate>
          <div class="form-field">
            <label for="password">新しいパスワード</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
            <p class="form-hint">8文字以上</p>
          </div>
          <div class="form-field">
            <label for="password-confirm">新しいパスワード（確認）</label>
            <input id="password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" required />
          </div>
          <p class="form-status" id="form-status" role="alert" hidden></p>
          <button type="submit" class="btn btn-next">パスワードを変更する</button>
        </form>
        <div class="auth-links">
          <a href="/forgot-password">リンクを再送する</a>
          <a href="/login">ログインに戻る</a>
        </div>
      </main>
    </div>

    <script type="module" src="/src/auth/reset-password.js"></script>
  </body>
</html>
