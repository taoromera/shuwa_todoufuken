<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a365d" />
    <title>動画ライブラリ ・ 手話単語帳</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/auth/auth.css" />
    <link rel="stylesheet" href="/src/library/library.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1>動画ライブラリ</h1>
        <p class="subtitle">みんなで共有している手話動画</p>
      </header>

      <div class="library-search">
        <label class="lesson-picker-label" for="library-query">言葉・読みで検索</label>
        <input
          class="library-search-input"
          id="library-query"
          type="search"
          placeholder="例：あお、青"
          autocomplete="off"
          enterkeyhint="search"
        />
        <p class="library-count" id="library-count" aria-live="polite"></p>
      </div>

      <main class="library-list" id="library-list"></main>
    </div>

    <script type="module" src="/src/library/library.js"></script>
  </body>
</html>
