<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a365d" />
    <title>パスワードをお忘れの方 ・ 手話単語帳</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/auth/auth.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1>手話単語帳</h1>
      </header>

      <main class="auth-card">
        <h2>パスワードの再設定</h2>
        <p>登録したメールアドレスを入力してください。パスワード再設定用のリンクをお送りします。</p>
        <form class="auth-form" id="forgot-form" novalidate>
          <div class="form-field">
            <label for="email">メールアドレス</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <p class="form-status" id="form-status" role="alert" hidden></p>
          <button type="submit" class="btn btn-next">再設定リンクを送る</button>
        </form>
        <div class="auth-links">
          <a href="/login">ログインに戻る</a>
        </div>
      </main>
    </div>

    <script type="module" src="/src/auth/forgot-password.js"></script>
  </body>
</html>
