<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a365d" />
    <title>ログイン ・ 手話単語帳</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/auth/auth.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1>手話単語帳</h1>
        <p class="subtitle">ログインして復習を続けましょう</p>
      </header>

      <main class="auth-card">
        <h2>ログイン</h2>
        <form class="auth-form" id="login-form" novalidate>
          <div class="form-field">
            <label for="email">メールアドレス</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="form-field">
            <label for="password">パスワード</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <label class="form-check">
            <input type="checkbox" name="rememberMe" checked />
            ログイン状態を保持する
          </label>
          <p class="form-status" id="form-status" role="alert" hidden></p>
          <button type="submit" class="btn btn-next">ログイン</button>
        </form>
        <div class="auth-links">
          <a href="/forgot-password">パスワードを忘れた方</a>
          <a href="/signup" id="signup-link">新規登録</a>
        </div>
      </main>
    </div>

    <script type="module" src="/src/auth/login.js"></script>
  </body>
</html>
