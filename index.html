<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a365d" />
    <meta name="description" content="日本手話の単語を復習する単語帳" />
    <title>手話単語帳</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/auth/auth.css" />
    <link rel="stylesheet" href="/src/study/study.css" />
  </head>
  <body>
    <div id="app">
      <p class="study-counter" id="study-counter" aria-live="polite" hidden></p>

      <div class="word-card" id="word-card" hidden>
        <p class="word-title" id="card-title"></p>
        <p class="word-caption" id="card-caption"></p>
      </div>

      <button type="button" class="btn btn-reveal" id="reveal-btn" hidden>答えを見る</button>

      <div class="answer-area" id="answer-area" hidden>
        <div id="answer-video"></div>
        <p class="study-notes" id="card-notes" hidden></p>
        <div class="rating-row" role="group" aria-label="思い出せましたか？">
          <button type="button" class="rating-btn rating-btn--again" data-rating="1">忘れてた</button>
          <button type="button" class="rating-btn rating-btn--hard" data-rating="2">ギリギリ</button>
          <button type="button" class="rating-btn rating-btn--good" data-rating="3">思い出せた</button>
          <button type="button" class="rating-btn rating-btn--easy" data-rating="4">余裕</button>
        </div>
      </div>

      <p class="form-status form-status--error" id="study-error" role="alert" hidden></p>

      <section class="auth-card study-message" id="study-message" hidden>
        <h2 id="message-title"></h2>
        <p id="message-body"></p>
        <a class="btn btn-next study-message-action" id="message-action" hidden></a>
      </section>

      <p class="study-loading" id="study-loading">読み込み中…</p>
    </div>

    <script type="module" src="/src/study/study.js"></script>
  </body>
</html>
